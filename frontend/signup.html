<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기찾이 - 회원가입</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Alibaba Sans TC';
      src: local('Alibaba Sans TC'), local('AlibabaSansTC-Bold');
      font-weight: 700;
    }
    body { font-family: 'Noto Sans KR', sans-serif; }
    h1, h2, h3, h4, .font-heading, .font-bold, .font-extrabold, .font-black {
      font-family: 'Alibaba Sans TC', 'Noto Sans KR', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-800 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-[#D8EEFF] px-8 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-8">
      <a href="index.html" class="text-2xl font-black text-slate-900 tracking-tight">기찾이</a>
      <nav class="flex space-x-6 text-sm font-medium text-slate-700">
        <a href="index.html" class="hover:text-slate-900">홈</a>
        <a href="ai-search.html" class="hover:text-slate-900">AI 기사 찾기</a>
        <a href="search.html" class="hover:text-slate-900">검색</a>
        <a href="word-learning.html" class="hover:text-slate-900">단어 학습</a>
        <a href="saved-articles.html" class="hover:text-slate-900">저장한 기사</a>
        <a href="mypage.html" class="hover:text-slate-900">마이페이지</a>
      </nav>
    </div>
    <a href="login.html" class="bg-[#A0D7FF] text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-sky-400 transition">로그인</a>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto mt-16 px-4">
    <h2 class="text-3xl font-black text-slate-900 text-center mb-10">만나서 반가워요</h2>

    <!-- Tabs -->
    <div class="flex border-b border-slate-200 mb-8 text-center text-sm font-bold">
      <a href="login.html" class="w-1/2 py-3 text-slate-400 hover:text-slate-900 transition">로그인</a>
      <a href="signup.html" class="w-1/2 py-3 text-slate-900 border-b-2 border-[#A0D7FF]">회원가입</a>
    </div>

    <!-- Signup Form -->
    <form class="space-y-6" onsubmit="event.preventDefault(); alert('가입이 완료되었습니다.'); location.href='login.html';">
      <div>
        <label class="block text-xs font-bold text-slate-800 mb-1.5 tracking-wider">ID</label>
        <div class="relative">
          <input type="text" placeholder="아이디를 입력하세요." class="w-full border border-sky-200 rounded-lg px-4 py-3 text-sm outline-none focus:border-sky-400 pr-24 placeholder:text-slate-400">
          <button type="button" class="absolute right-2 top-2 bg-[#A0D7FF] text-white px-3.5 py-1.5 rounded-md text-xs font-medium hover:bg-sky-400 transition">중복 확인</button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-800 mb-1.5 tracking-wider">PASSWORD</label>
        <div class="space-y-2">
          <input type="password" placeholder="비밀번호를 입력하세요." class="w-full border border-sky-200 rounded-lg px-4 py-3 text-sm outline-none focus:border-sky-400 placeholder:text-slate-400">
          <input type="password" placeholder="비밀번호를 재입력하세요." class="w-full border border-sky-200 rounded-lg px-4 py-3 text-sm outline-none focus:border-sky-400 placeholder:text-slate-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-800 mb-1.5 tracking-wider">NAME</label>
        <input type="text" placeholder="이름을 입력하세요." class="w-full border border-sky-200 rounded-lg px-4 py-3 text-sm outline-none focus:border-sky-400 placeholder:text-slate-400">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-800 mb-1.5 tracking-wider">BIRTH DAY</label>
        <div class="grid grid-cols-4 gap-2 text-center">
          <input type="text" placeholder="YYYY" class="border border-sky-200 rounded-lg px-3 py-3 text-sm outline-none focus:border-sky-400 text-center placeholder:text-slate-400">
          <input type="text" placeholder="MM" class="border border-sky-200 rounded-lg px-3 py-3 text-sm outline-none focus:border-sky-400 text-center placeholder:text-slate-400">
          <input type="text" placeholder="DD" class="border border-sky-200 rounded-lg px-3 py-3 text-sm outline-none focus:border-sky-400 text-center placeholder:text-slate-400">
          <div class="relative">
            <select class="w-full border border-sky-200 rounded-lg px-3 py-3 text-sm outline-none focus:border-sky-400 appearance-none bg-white text-slate-600 text-center cursor-pointer">
              <option value="" disabled selected hidden>성별</option>
              <option value="male">남성</option>
              <option value="female">여성</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-600 text-xs">
              ∨
            </div>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-800 mb-1.5 tracking-wider">E-MAIL</label>
        <div class="relative">
          <input type="email" placeholder="이메일을 입력하세요." class="w-full border border-sky-200 rounded-lg px-4 py-3 text-sm outline-none focus:border-sky-400 pr-24 placeholder:text-slate-400">
          <button type="button" class="absolute right-2 top-2 bg-[#A0D7FF] text-white px-3.5 py-1.5 rounded-md text-xs font-medium hover:bg-sky-400 transition">중복 확인</button>
        </div>
      </div>

      <div class="flex justify-center space-x-3 pt-6">
        <button type="submit" class="bg-[#A0D7FF] text-white px-8 py-2.5 rounded-lg text-sm font-semibold hover:bg-sky-400 transition">가입하기</button>
        <button type="button" onclick="location.href='index.html'" class="border border-sky-200 text-slate-700 px-8 py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-50 transition">가입취소</button>
      </div>

    </form>
  </main>
</body>
</html>
