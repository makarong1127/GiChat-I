<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기찾이 - 마이페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Alibaba Sans TC';
      src: local('Alibaba Sans TC'), local('AlibabaSansTC-Bold');
      font-weight: 700;
    }
    body { font-family: 'Noto Sans KR', sans-serif; }
    h1, h2, h3, h4, .font-heading, .font-bold, .font-extrabold, .font-black {
      font-family: 'Alibaba Sans TC', 'Noto Sans KR', sans-serif;
    }
    .font-mono-badge { font-family: 'IBM Plex Mono', 'Noto Sans KR', monospace; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-[#D8EEFF] px-8 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-8">
      <a href="index.html" class="text-2xl font-black text-slate-900 tracking-tight">기찾이</a>
      <nav class="flex space-x-6 text-sm font-medium text-slate-700">
        <a href="index.html" class="hover:text-slate-900">홈</a>
        <a href="ai-search.html" class="hover:text-slate-900">AI 기사 찾기</a>
        <a href="search.html" class="hover:text-slate-900">검색</a>
        <a href="word-learning.html" class="hover:text-slate-900">단어 학습</a>
        <a href="saved-articles.html" class="hover:text-slate-900">저장한 기사</a>
        <a href="mypage.html" class="font-bold text-slate-900 border-b-2 border-slate-900 pb-0.5">마이페이지</a>
      </nav>
    </div>
    <button class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-300 transition">로그아웃</button>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto mt-8 px-4 space-y-8">
    <h2 class="text-3xl font-black text-slate-900">마이페이지</h2>

    <section class="border border-slate-200 bg-white rounded-2xl p-6 shadow-sm flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <div class="w-16 h-16 bg-[#D8EEFF] text-[#A0D7FF] rounded-full flex items-center justify-center font-black text-2xl">
          👤
        </div>
        <div>
          <h3 class="text-xl font-bold text-slate-900">홍길동 님</h3>
          <p class="text-xs text-slate-400">user@example.com</p>
        </div>
      </div>
      <button class="border border-slate-200 text-slate-600 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-slate-50">
        프로필 수정
      </button>
    </section>

    <section class="border border-slate-200 bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h3 class="text-lg font-bold text-slate-900">내 관심 분야 설정</h3>
          <p class="text-xs text-slate-400">선택한 분야의 뉴스를 맞춤으로 추천해 드립니다.</p>
        </div>
        <button class="bg-[#A0D7FF] text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-sky-400">저장</button>
      </div>

      <div class="flex flex-wrap gap-2 text-xs">
        <button class="bg-[#EBF5FF] text-[#3B82F6] border border-[#D8EEFF] px-4 py-2 rounded-full font-bold">IT·개발</button>
        <button class="border border-slate-200 bg-white text-slate-600 px-4 py-2 rounded-full hover:bg-slate-50">의료·보건</button>
        <button class="border border-slate-200 bg-white text-slate-600 px-4 py-2 rounded-full hover:bg-slate-50">교육</button>
        <button class="bg-[#EBF5FF] text-[#3B82F6] border border-[#D8EEFF] px-4 py-2 rounded-full font-bold">경영·경제</button>
        <button class="border border-slate-200 bg-white text-slate-600 px-4 py-2 rounded-full hover:bg-slate-50">디자인·예술</button>
        <button class="border border-slate-200 bg-white text-slate-600 px-4 py-2 rounded-full hover:bg-slate-50">공학·제조</button>
        <button class="border border-slate-200 bg-white text-slate-600 px-4 py-2 rounded-full hover:bg-slate-50">법·행정</button>
      </div>
    </section>

    <section class="border border-slate-200 bg-white rounded-2xl p-6 shadow-sm space-y-4">
      <h3 class="text-lg font-bold text-slate-900">나의 학습 현황</h3>

      <div class="grid grid-cols-3 gap-4 text-center">
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-4">
          <span class="text-xs text-slate-400 block mb-1">읽은 기사</span>
          <span class="text-2xl font-black text-sky-500 font-mono-badge">12</span>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-4">
          <span class="text-xs text-slate-400 block mb-1">저장한 기사</span>
          <span class="text-2xl font-black text-sky-500 font-mono-badge">3</span>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-4">
          <span class="text-xs text-slate-400 block mb-1">단어장 등록</span>
          <span class="text-2xl font-black text-sky-500 font-mono-badge">8</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
